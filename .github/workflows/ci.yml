name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate SKILL.md frontmatter
        run: python scripts/validate_skill_frontmatter.py

      - name: Portability & functional-domain audit
        run: python skills/skill-quality/scripts/skill_audit.py
